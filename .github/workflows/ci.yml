name: CI

# Run the same quality gates as local development on every change that targets
# `main`, and allow manual runs from the Actions tab.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Cancel any in-progress run for the same branch/PR when a newer commit arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Pin to the exact Flutter version used by the project toolchain, not the
      # floating "stable" channel, so CI matches local results.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      # Generated sources (e.g. Drift `*.g.dart`) are gitignored, so CI must
      # produce them before analysing. Guarded because `build_runner` is not a
      # dependency yet: without the guard this step would fail immediately.
      # The guard can be removed once build_runner is permanently in place.
      - name: Generate code
        run: |
          if grep -qE '^\s*build_runner:' pubspec.yaml; then
            dart run build_runner build --delete-conflicting-outputs
          else
            echo "build_runner is not a dependency yet — skipping code generation."
          fi

      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run tests
        run: flutter test
